[workspace.package]
authors = ["WeTEE DAO"]
edition = "2021"
homepage = "https://wetee.app"
license = "Apache 2.0"
repository = "https://github.com/wetee-dao/chain"
version = "0.1.0"

[workspace.lints]

[workspace]
exclude = ["native-nostd-hasher"]
members = [
  # 工具
  # "tools/hash",
  # "tools/subkey",
  # "tools/chain-spec-builder",

  # solo node
  "packages/solochain/node",
  "packages/solochain/runtime",
]
resolver = "2"

[workspace.dependencies]
array-bytes = "6.2.3"
clap = { version = "4.5.13", features = ["derive"] }
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = [
  "derive",
] }
futures = "0.3.31"
docify = "0.2.9"
futures-timer = "3.0.3"
hex-literal = { version = "0.4.1" }
jsonrpsee = { version = "0.24.10", features = ["server"] }
log = { version = "0.4.22", default-features = false }
serde = { version = "1.0.214", default-features = false }
serde-big-array = { version = "0.3.2" }
serde_derive = { version = "1.0.117" }
serde_json = { version = "1.0.132", default-features = false }
serde_with = { version = "3.12.0", default-features = false, features = ["hex", "macros"] }
serde_yaml = { version = "0.9" }
scale-info = { version = "2.11.6", default-features = false, features = [
  "derive",
] }
smallvec = "1.11.0"
color-print = "0.3.4"

# Substrate
frame-benchmarking = { git = "https://github.com/paritytech/polkadot-sdk", branch = "master", default-features = false }
frame-benchmarking-cli = { git = "https://github.com/paritytech/polkadot-sdk", branch = "master" }
frame-executive = { git = "https://github.com/paritytech/polkadot-sdk", branch = "master", default-features = false }
frame-support = { git = "https://github.com/paritytech/polkadot-sdk", branch = "master", default-features = false }
