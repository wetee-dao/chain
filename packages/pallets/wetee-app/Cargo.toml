[package]
authors = ["WeTEE DAO"]
edition = "2021"
name = "wetee-app"
publish = false
version = "1.0.0"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
frame-benchmarking = {workspace = true}
frame-support = {workspace = true}
frame-system = {workspace = true}
log = {workspace = true}
pallet-balances = {workspace = true}
parity-scale-codec = {workspace = true, default-features = false, features = [
  "derive",
]}
scale-info = {workspace = true}
sp-runtime = {workspace = true}
sp-std = {workspace = true}

orml-tokens = {workspace = true}
orml-traits = {workspace = true}
wetee-assets = {path = "../wetee-assets", package = "wetee-assets", default-features = false}
wetee-dao = {path = "../wetee-dao", package = "wetee-dao", default-features = false}
wetee-primitives = {path = "../../primitives", package = "wetee-primitives", default-features = false}

[dev-dependencies]
sp-core = {workspace = true}
sp-io = {workspace = true}
sp-runtime = {workspace = true}

[features]
default = ["std"]
runtime-benchmarks = [
  "frame-benchmarking/runtime-benchmarks",
  "frame-support/runtime-benchmarks",
  "frame-system/runtime-benchmarks",
  "sp-runtime/runtime-benchmarks",
]
std = [
  "parity-scale-codec/std",
  "frame-benchmarking/std",
  "frame-support/std",
  "frame-system/std",
  "scale-info/std",
  "pallet-balances/std",
  "wetee-primitives/std",
  "wetee-dao/std",
  "wetee-assets/std",
]
try-runtime = [
  "frame-support/try-runtime",
  "frame-system/try-runtime",
  "sp-runtime/try-runtime",
  "pallet-balances/try-runtime",
  "wetee-dao/try-runtime",
  "wetee-assets/try-runtime",
]
