[package]
authors = ["WeTEE DAO"]
edition = "2021"
name = "wetee-assets"
publish = false
version = "1.0.0"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
frame-benchmarking = {workspace = true}
frame-support = {workspace = true}
frame-system = {workspace = true}
hex-literal = {version = "0.4.1"}
pallet-balances = {workspace = true}
pallet-sudo = {workspace = true}
parity-scale-codec = {workspace = true, default-features = false, features = [
  "derive",
]}
scale-info = {workspace = true, default-features = false, features = [
  "derive",
]}
serde = {workspace = true, features = ["derive"]}
sp-core = {workspace = true}
sp-io = {workspace = true}
sp-runtime = {workspace = true}
sp-std = {workspace = true}

orml-tokens = {workspace = true}
orml-traits = {workspace = true}
orml-utilities = {workspace = true}

wetee-dao = {path = "../wetee-dao", package = "wetee-dao", default-features = false}
wetee-primitives = {path = "../../primitives", package = "wetee-primitives", default-features = false}
wetee-sudo = {path = "../wetee-sudo", package = "wetee-sudo", default-features = false}

[dev-dependencies]
sp-runtime = {workspace = true}

[features]
default = ["std"]
runtime-benchmarks = [
  "frame-benchmarking/runtime-benchmarks",
  "frame-support/runtime-benchmarks",
  "frame-system/runtime-benchmarks",
  "sp-runtime/runtime-benchmarks",
  "pallet-balances/runtime-benchmarks",
  "orml-tokens/runtime-benchmarks",
]
std = [
  "parity-scale-codec/std",
  "frame-benchmarking/std",
  "frame-support/std",
  "frame-system/std",
  "sp-io/std",
  "scale-info/std",
  "pallet-balances/std",
  "orml-traits/std",
  "orml-tokens/std",
  "wetee-primitives/std",
  "wetee-dao/std",
  "wetee-sudo/std",
  "pallet-sudo/std",
  "orml-utilities/std",
  "serde/std",
]
try-runtime = ["frame-support/try-runtime"]
